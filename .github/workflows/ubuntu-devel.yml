name: "Ubuntu devel"

on:
  schedule:
    # Every Friday at 18:20 UTC, so we can fix the issue over the weekend
    - cron: "20 18 * * 5"
  workflow_dispatch:

# No permissions by default; each job requests what it needs.
permissions: {}

jobs:
  main:
    name: "Test: Python 3.14"
    runs-on: ubuntu-24.04

    # Deliberately unpinned: the container should be automatically updated
    # from time to time.
    container: ubuntu:devel # zizmor: ignore[unpinned-images]
    permissions:
      contents: read # Check out the repository.

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            python3 \
            python3-gst-1.0 \
            tox
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: tox -e py314
