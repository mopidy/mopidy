name: Release

on:
  release:
    types: [published]

# No permissions by default; each job requests what it needs.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mopidy/
    permissions:
      contents: read # Check out the repository.
      id-token: write # Authenticate with PyPI using trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
