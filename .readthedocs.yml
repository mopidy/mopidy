version: 2

build:
  os: ubuntu-24.04
  tools:
    python: latest
  apt_packages:
    # pyobject dependencies
    - libcairo2-dev
    - libgirepository-2.0-dev
  jobs:
    build:
      html:
        - zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp -r site/* $READTHEDOCS_OUTPUT/html/

python:
  install:
    - method: uv
      command: sync
      extras: all
      groups:
        - docs
